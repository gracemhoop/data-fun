<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Row-Level Validation Builder</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --border: #d8d6d1;
    --text: #1c1c1a;
    --muted: #6b6b66;
    --accent: #c46a2b;
    --accent-hover: #a85820;
    --ok: #2f7a4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--muted);
    margin-bottom: 20px;
    font-size: 13px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    max-width: 1200px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
  }
  .panel h2 {
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 8px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  input[type="text"], textarea {
    width: 100%;
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #fbfaf7;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text);
    resize: vertical;
  }
  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
  }
  textarea {
    min-height: 260px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .field { margin-bottom: 10px; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  button {
    font: 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 6px 10px;
    cursor: pointer;
    transition: background 0.12s;
  }
  button:hover { background: var(--accent-hover); }
  button.ok { background: var(--ok); }
  .out {
    background: #fbfaf7;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 80px;
  }
  .out.chain { min-height: 220px; }
  .meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
  .section-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 4px 0 8px;
    max-width: 1200px;
  }
  .section-label + .grid {
    margin-bottom: 24px;
  }
  .two-col {
    display: grid;
    grid-template-columns: 1fr 120px;
    gap: 10px;
  }
  @media (max-width: 800px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <h1>Row-Level Validation Builder</h1>
  <div class="sub">Paste a column of values, give the column a name, and copy the SQL-style OR chain and the matching sentence.</div>

  <div class="section-label">Enum filter</div>
  <div class="grid">
    <div class="panel">
      <h2>Input</h2>
      <div class="field">
        <label for="colname">Column name</label>
        <input type="text" id="colname" value="population" autocomplete="off" spellcheck="false">
      </div>
      <div class="field" style="flex: 1; display: flex; flex-direction: column;">
        <label for="values">Values (one per line)</label>
        <textarea id="values" spellcheck="false" placeholder="Local Hires&#10;Assignees&#10;HPS Local Hires"></textarea>
      </div>
      <div class="meta" id="stats">0 values</div>
    </div>

    <div class="panel">
      <h2>Output</h2>

      <div class="field">
        <div class="row">
          <label style="margin: 0;">OR chain</label>
          <button id="copyChain" type="button">Copy</button>
        </div>
        <div class="out chain" id="chainOut"></div>
      </div>

      <div class="field">
        <div class="row">
          <label style="margin: 0;">Comma-separated (one line)</label>
          <button id="copyCsv" type="button">Copy</button>
        </div>
        <div class="out" id="csvOut"></div>
      </div>

      <div class="field">
        <div class="row">
          <label style="margin: 0;">Sentence</label>
          <button id="copySentence" type="button">Copy</button>
        </div>
        <div class="out" id="sentenceOut"></div>
      </div>
    </div>
  </div>

  <div class="section-label">Length check</div>
  <div class="grid">
    <div class="panel">
      <h2>Input</h2>
      <div class="two-col">
        <div class="field">
          <label for="lencol">Date column name</label>
          <input type="text" id="lencol" value="date_of_service" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label for="lenval">Length</label>
          <input type="text" id="lenval" value="10" autocomplete="off" inputmode="numeric">
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Output</h2>

      <div class="field">
        <div class="row">
          <label style="margin: 0;">Length filter</label>
          <button id="copyLenFilter" type="button">Copy</button>
        </div>
        <div class="out" id="lenFilterOut"></div>
      </div>

      <div class="field">
        <div class="row">
          <label style="margin: 0;">Sentence</label>
          <button id="copyLenSentence" type="button">Copy</button>
        </div>
        <div class="out" id="lenSentenceOut"></div>
      </div>
    </div>
  </div>

<script>
  const $col = document.getElementById('colname');
  const $vals = document.getElementById('values');
  const $chain = document.getElementById('chainOut');
  const $csv = document.getElementById('csvOut');
  const $sentence = document.getElementById('sentenceOut');
  const $stats = document.getElementById('stats');
  const $copyChain = document.getElementById('copyChain');
  const $copyCsv = document.getElementById('copyCsv');
  const $copySentence = document.getElementById('copySentence');

  function escapeSql(s) {
    return s.replace(/'/g, "''");
  }

  function build() {
    const col = ($col.value || 'population').trim() || 'population';

    const rawLines = $vals.value.split(/\r?\n/);
    const cleaned = rawLines.map(l => l.trim());

    const seen = new Set();
    const unique = [];
    for (const v of cleaned) {
      if (!seen.has(v)) {
        seen.add(v);
        unique.push(v);
      }
    }

    const hasAny = unique.length > 0 && !(unique.length === 1 && unique[0] === '');

    const chainLines = unique.map(v => `${col} = '${escapeSql(v)}'`);
    const chain = chainLines.join(' ||\n');

    const csv = unique.join(', ');

    $chain.textContent = chain;
    $csv.textContent = csv;
    $sentence.textContent = `Values for ${col} fall outside of vendor-defined enumerations`;

    const blanks = unique.filter(v => v === '').length;
    const nonBlanks = unique.length - blanks;
    let stat = `${nonBlanks} unique value${nonBlanks === 1 ? '' : 's'}`;
    if (blanks) stat += ` + 1 blank`;
    const dupesRemoved = cleaned.length - unique.length - cleaned.filter(v => v === '').length + blanks;
    if (dupesRemoved > 0) stat += ` (${dupesRemoved} duplicate${dupesRemoved === 1 ? '' : 's'} removed)`;
    $stats.textContent = hasAny ? stat : '0 values';
  }

  function copyText(el, btn) {
    const text = el.textContent;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const orig = btn.textContent;
      btn.textContent = 'Copied';
      btn.classList.add('ok');
      setTimeout(() => {
        btn.textContent = orig;
        btn.classList.remove('ok');
      }, 1000);
    });
  }

  $col.addEventListener('input', build);
  $vals.addEventListener('input', build);
  $copyChain.addEventListener('click', () => copyText($chain, $copyChain));
  $copyCsv.addEventListener('click', () => copyText($csv, $copyCsv));
  $copySentence.addEventListener('click', () => copyText($sentence, $copySentence));

  const $lencol = document.getElementById('lencol');
  const $lenval = document.getElementById('lenval');
  const $lenFilter = document.getElementById('lenFilterOut');
  const $lenSentence = document.getElementById('lenSentenceOut');
  const $copyLenFilter = document.getElementById('copyLenFilter');
  const $copyLenSentence = document.getElementById('copyLenSentence');

  function buildLength() {
    const col = ($lencol.value || 'date_of_service').trim() || 'date_of_service';
    const len = $lenval.value.trim();
    $lenFilter.textContent = `len(${col}) = ${len}`;
    $lenSentence.textContent = `Invalid length for ${col}`;
  }

  $lencol.addEventListener('input', buildLength);
  $lenval.addEventListener('input', buildLength);
  $copyLenFilter.addEventListener('click', () => copyText($lenFilter, $copyLenFilter));
  $copyLenSentence.addEventListener('click', () => copyText($lenSentence, $copyLenSentence));

  build();
  buildLength();
</script>
</body>
</html>
